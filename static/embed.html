<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chappa V2 — Live Mask Embed</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: #eaf6ff;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; background: transparent; }
    canvas:active { cursor: grabbing; }
    .badge {
      position: fixed;
      left: 10px;
      bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(6, 11, 22, 0.84);
      border: 1px solid rgba(8, 182, 232, 0.55);
      box-shadow: -1.5px 0 0 rgba(232, 28, 46, 0.55);
      color: #dcf6ff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #08b6e8; box-shadow: 0 0 8px #08b6e8; }
    .badge.alert { border-color: rgba(232, 28, 46, 0.8); }
    .badge.alert .dot { background: #e81c2e; box-shadow: 0 0 8px #e81c2e; }
    .open-btn {
      border: 1px solid rgba(8, 182, 232, 0.45);
      background: rgba(8, 182, 232, 0.18);
      color: #ffffff;
      border-radius: 4px;
      padding: 1px 6px;
      font: inherit;
      font-size: 9.5px;
      cursor: pointer;
    }
    .open-btn:hover { background: rgba(8, 182, 232, 0.35); }
  </style>
</head>
<body>
  <canvas id="maskCanvas"></canvas>
  <div id="threatBadge" class="badge" onclick="openChappa()">
    <span class="dot"></span>
    <span id="badgeText">CHAPPA V2 · IDLE · 0 ALERTS</span>
    <button type="button" class="open-btn" onclick="event.stopPropagation();openChappa()">Open</button>
  </div>
  <script src="static/chappa-mask.js"></script>
  <script>
    const stage = ChappaMask.createMaskStage(document.getElementById('maskCanvas'), { transparent: true, fps: 12, zoom: 1.04 });
    function openChappa() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ chappaOpenFull: 1 }, '*');
        } else {
          window.open('./', '_blank');
        }
      } catch (_) {}
    }
    async function poll() {
      try {
        const r = await fetch('api/chappa/status', { cache: 'no-store' });
        if (!r.ok) return;
        const d = await r.json();
        stage.setState(d.mask_state || 'IDLE');
        stage.setFps(d.fps_cadence || 12);
        const b = document.getElementById('threatBadge');
        b.classList.toggle('alert', d.mask_state === 'ALERT' || (d.open_alerts || 0) > 0);
        const tgt = d.active_target ? ` · ${d.active_target}` : '';
        document.getElementById('badgeText').textContent = `CHAPPA V2 · ${d.mask_state || 'IDLE'}${tgt} · ${d.open_alerts || 0} ALERTS`;
      } catch (_) {}
    }
    poll();
    setInterval(poll, 4000);
  </script>
</body>
</html>
