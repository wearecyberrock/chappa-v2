<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chappa V2 — Red Matrix 3D Mask Card</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #050103; color: #fff0f2;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: none;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
    #matrixCanvas { pointer-events: none; z-index: 1; }
    #maskCanvas { cursor: grab; z-index: 2; }
    #hudCanvas { pointer-events: none; z-index: 3; }
    .badge {
      position: fixed; left: 10px; bottom: 8px; z-index: 5;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(16, 3, 7, 0.90);
      border: 1px solid rgba(255, 30, 56, 0.65);
      box-shadow: -1.5px 0 0 rgba(255, 110, 128, 0.65);
      color: #ffe8ec; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff1e38; box-shadow: 0 0 8px #ff1e38; }
    .open-btn {
      border: 1px solid rgba(255, 30, 56, 0.55); background: rgba(232, 28, 46, 0.25);
      color: #fff; border-radius: 4px; padding: 1px 6px; font: inherit; font-size: 9.5px; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <canvas id="maskCanvas"></canvas>
  <canvas id="hudCanvas"></canvas>
  <div id="threatBadge" class="badge" onclick="openChappa()">
    <span class="dot"></span>
    <span id="badgeText">CHAPPA V2 · RED MATRIX · 0 OPEN</span>
    <button type="button" class="open-btn" onclick="event.stopPropagation();openChappa()">Open</button>
  </div>
  <script src="static/chappa-mask.js"></script>
  <script>
    const stage = ChappaMask.createMaskStage(document.getElementById('maskCanvas'), {
      matrixCanvas: document.getElementById('matrixCanvas'),
      hudCanvas: document.getElementById('hudCanvas'),
      theme: 'red-matrix',
      fps: 60,
      zoom: 1.06
    });
    function openChappa() {
      try {
        if (window.parent && window.parent !== window) window.parent.postMessage({ chappaOpenFull: 1 }, '*');
        else window.open('./', '_blank');
      } catch (_) {}
    }
    function apply(d) {
      if (!d) return;
      stage.setState(d.mask_state || 'IDLE');
      document.getElementById('badgeText').textContent = `CHAPPA V2 · ${d.mask_state || 'IDLE'} · ${d.open_alerts || 0} OPEN · ${d.pins_count || 0} PINS`;
    }
    window.addEventListener('message', (ev) => {
      const d = ev && ev.data;
      if (!d || typeof d !== 'object') return;
      if (typeof d.chappaSpeechLevel === 'number') stage.setSpeechLevel(d.chappaSpeechLevel);
      if (typeof d.chappaSpeaking === 'boolean') stage.setSpeaking(d.chappaSpeaking);
    });
    fetch('api/chappa/status', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(apply).catch(() => {});
    if (typeof EventSource !== 'undefined') {
      const es = new EventSource('api/chappa/events');
      es.addEventListener('status', (ev) => { try { apply(JSON.parse(ev.data)); } catch (_) {} });
    }
  </script>
</body>
</html>
