# Hardening & Compliance — proving a system is configured defensively and
# measuring drift from a benchmark. Blue team's preventive half: these change
# posture rather than react to events.
category:
  title: "Hardening & Compliance"
  icon: "🔒"
  menu_label: "Hardening"
  description: "Baseline and audit posture: Lynis, OpenSCAP, Prowler, auditd, CIS."
  merge_into: null
  team: blue

tools:
  - title: "Lynis (System Hardening Audit)"
    tags: [hardening, compliance, reporting]
    description: "Host security audit producing a hardening index plus concrete remediation suggestions."
    system_pkgs: {which: lynis, apt: lynis, brew: lynis}
    run: ["lynis --version"]
    usage:
      - ["audit the local system", "sudo lynis audit system"]
      - ["audit a dockerfile", "lynis audit dockerfile Dockerfile"]
      - ["show only warnings", "sudo lynis audit system --quick | grep -i warning"]
    lab_safe_notes: >-
      Read-only audit; it suggests changes but does not apply them.
    project_url: "https://github.com/CISOfy/lynis"

  - title: "OpenSCAP (Compliance Scanning)"
    tags: [hardening, compliance, reporting]
    description: "Evaluate hosts against SCAP security policies (CIS, STIG, PCI-DSS) and generate ARF/HTML reports."
    system_pkgs: {which: oscap, apt: openscap-scanner, brew: openscap}
    run: ["oscap --version"]
    usage:
      - ["list available profiles", "oscap info --profiles ssg-rhel9-ds.xml"]
      - ["evaluate and write a report", "oscap xccdf eval --profile cis --results results.xml --report report.html ssg-rhel9-ds.xml"]
      - ["validate a datastream file", "oscap ds sds-validate ssg-rhel9-ds.xml"]
    lab_safe_notes: >-
      Evaluation is read-only; remediation scripts generated by the profile change
      the system and must be reviewed first.
    project_url: "https://github.com/OpenSCAP/openscap"

  - title: "Prowler (Cloud Security Audit)"
    tags: [hardening, compliance, cloud, reporting]
    description: "Multi-cloud posture scanner with hundreds of checks mapped to CIS, PCI, HIPAA, and SOC2 controls."
    system_pkgs: {which: prowler}
    install: {pipx: prowler}
    run: ["prowler --version"]
    usage:
      - ["audit the current AWS account", "prowler aws --severity critical high"]
      - ["run one compliance framework", "prowler aws --compliance cis_4.0_aws"]
      - ["scan a specific region only", "prowler aws --region us-east-1"]
    lab_safe_notes: >-
      Needs read-only cloud credentials. Use a dedicated audit role, never an admin
      key, and expect API spend from large scans.
    project_url: "https://github.com/prowler-cloud/prowler"

  - title: "auditd (Kernel Audit Rules)"
    tags: [hardening, monitoring, detection, evidence-collection]
    description: "Linux audit subsystem: watch files, syscalls, and privilege changes, and record the evidence trail."
    system_pkgs: {which: auditctl, apt: auditd, brew: auditd}
    run: ["auditctl -v"]
    usage:
      - ["list active rules", "sudo auditctl -l"]
      - ["watch a sensitive file for writes", "sudo auditctl -w /etc/passwd -p wa -k identity"]
      - ["audit execve for a user", "sudo auditctl -a always,exit -F arch=b64 -S execve -F uid=1001 -k user_exec"]
      - ["search the audit log for a key", "sudo ausearch -k identity -i"]
    lab_safe_notes: >-
      Rules persist only if written to /etc/audit/rules.d; high-volume syscall rules
      can fill the log partition — size it first.
    project_url: "https://github.com/linux-audit/audit-userspace"

  - title: "CIS Benchmarks"
    kind: resource
    tags: [hardening, compliance, reference]
    description: "Consensus configuration baselines per OS/cloud product; the mapping most compliance reports cite."
    url: "https://www.cisecurity.org/cis-benchmarks"
    usage:
      - ["map a finding to a control", "open the matching benchmark PDF and cite the control id"]
    lab_safe_notes: >-
      Benchmarks are licensing-restricted PDFs; cite control IDs rather than
      redistributing text.
    project_url: "https://www.cisecurity.org/cis-benchmarks"
